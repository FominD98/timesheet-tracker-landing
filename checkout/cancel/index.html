<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Checkout closed | Timesheet Tracker Pro</title>
	<meta name="robots" content="noindex, nofollow">
	<meta name="theme-color" content="#f5f6fb">
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
	<link rel="stylesheet" href="/css/landing.css">
	<link rel="stylesheet" href="/checkout/checkout.css">
</head>
<body>
	<header class="site-header">
		<nav class="wrap nav" aria-label="Main">
			<a class="brand" href="/"><img src="/img/mark.svg" width="30" height="30" alt=""><span>Timesheet Tracker</span></a>
		</nav>
	</header>
	<main id="main">
		<section class="page-hero">
			<div class="aurora" aria-hidden="true"></div>
			<div class="wrap">
				<h1>Checkout closed</h1>
				<p class="dek">Nothing was charged. The app keeps working: capture, the day strip and manual assignment stay free, and nothing is deleted.</p>
				<div class="co-actions"><a class="btn btn-primary" id="again" href="/checkout/">Back to checkout</a></div>
				<p class="co-note">Payments are processed by Paddle.com, our merchant of record. Questions: <a href="mailto:help@timesheet-tracker.com">help@timesheet-tracker.com</a></p>
			</div>
		</section>
	</main>
	<script>
	// Вернуться к той же транзакции (txn и sandbox из адреса)
	(function () {
		var p = new URLSearchParams(location.search), txn = p.get('txn');
		if (!txn || !/^txn_[a-z0-9]+$/i.test(txn)) { document.getElementById('again').hidden = true; return; }
		document.getElementById('again').href = '/checkout/?txn=' + encodeURIComponent(txn) + (p.get('sandbox') === '1' ? '&sandbox=1' : '');
	})();
	</script>
</body>
</html>
